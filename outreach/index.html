<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>private · shayel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffffff'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='22' fill='%232346D8'%3Es%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --muted: #555555; --rule: #d6d6d6; --dot: #e4e4e4;
    --accent: #2346d8; --bad: #b42318;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f0f10; --ink: #ededeb; --muted: #a3a3a0; --rule: #3a3a3b; --dot: #1f1f21; --accent: #7f9bff; --bad: #ff8a80; }
  }
  :root[data-theme="dark"] { --bg: #0f0f10; --ink: #ededeb; --muted: #a3a3a0; --rule: #3a3a3b; --dot: #1f1f21; --accent: #7f9bff; --bad: #ff8a80; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100dvh;
    background: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
    background-size: 22px 22px;
    color: var(--ink);
    font: 15px/1.65 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 28px; background: var(--bg); padding: 8px 0; }
  .label { font-size: 13px; color: var(--muted); }
  h1 { margin: 0; font: 400 36px/1.1 "Newsreader", Georgia, serif; }
  h1 em { color: var(--accent); }
  form { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; }
  input {
    flex: 1 1 auto; min-width: 0; min-height: 48px; padding: 0 14px;
    font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--rule); border-radius: 10px;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  button {
    flex: 0 0 auto; min-height: 48px; padding: 0 18px;
    font: inherit; font-weight: 500; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; cursor: pointer;
  }
  :root:not([data-theme="light"]) button { color: var(--bg); }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) button { color: #fff; } }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .msg { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--muted); }
  .msg.bad { color: var(--bad); }
  form.shake { animation: shake .35s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  a { color: var(--ink); text-underline-offset: 3px; }
  a:hover { color: var(--accent); }
  .back { font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { form.shake { animation: none; } }
</style>
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<main>
  <div>
    <div class="label">shayel khatiwoda</div>
    <h1>this one's <em>private</em>.</h1>
  </div>
  <form id="gate" autocomplete="on">
    <label class="label" for="pw">password</label>
    <input type="text" name="username" value="outreach" autocomplete="username" hidden>
    <div class="row">
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="go" type="submit">open →</button>
    </div>
    <p id="msg" class="msg" aria-live="polite"></p>
  </form>
  <a class="back" href="/">← back to shayel.world</a>
</main>
<script>
  // the destination is encrypted with the password (aes-256-gcm, key from pbkdf2-sha256),
  // so it can't be read from this page's source
  var LOCK = { salt: "QPZRFwmtnmnnRjqmaftu2w==", iv: "9yqM9VttOShExrNV", data: "vfjr2kn9Zcbm0+lS+RSkh7wVFEuNo9f7KRzw0UQTiu38cgxyjkyUBJfCbPvv2SY+U3NRXiKDdnIlWFbJ8oRocrU=", iter: 600000 };
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function unlock(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(LOCK.salt), iterations: LOCK.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(LOCK.iv) }, key, b64(LOCK.data));
    return new TextDecoder().decode(out);
  }
  var form = document.getElementById('gate'), pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { msg.className = 'msg bad'; msg.textContent = 'this browser can’t unlock it. try another one.'; return; }
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'checking…';
    try {
      var url = await unlock(pw.value);
      if (!/^https:\/\/claude\.ai\//.test(url)) throw new Error('bad');
      msg.textContent = 'opening your tracker…';
      window.location.replace(url);
    } catch (err) {
      go.disabled = false; msg.className = 'msg bad'; msg.textContent = 'wrong password.';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      pw.select();
    }
  });
</script>
</body>
</html>
